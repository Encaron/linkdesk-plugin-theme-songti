<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- theme-songti 身份图「纸白墨黑」：一张右上折角的纸，纸上一横一竖两笔墨
       意象 = 该主题把全 UI 字族换成宋体 SimSun + 纸白墨黑文档感
       ——故载体不做方块而做「纸」，墨笔取宋体的两处字形特征：
         ① 横细竖粗的粗细对比  ② 横的起笔/收笔三角顿角（竖的悬针收笔）
       家族：双档渐变 + 白玻璃罩 + 发丝光边（Type-2 彩色身份图）；墨 #2A2722 纸 #FBF8F2 取主题色 -->
  <defs>
    <!-- 纸色不做纯白偏暖一档：亮色主题的侧栏本身是近白，纯白纸会糊在底上 -->
    <linearGradient id="stPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3E7"/>
      <stop offset="1" stop-color="#E3D9C3"/>
    </linearGradient>
    <linearGradient id="stSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- 纸页（右上折角） -->
  <path d="M4 7 A3 3 0 0 1 7 4 H37 L44 11 V41 A3 3 0 0 1 41 44 H7 A3 3 0 0 1 4 41 Z" fill="url(#stPaper)"/>
  <path d="M37 4 L44 11 H37 Z" fill="#DCD2BE"/>
  <path d="M4 7 A3 3 0 0 1 7 4 H37 L44 11 V41 A3 3 0 0 1 41 44 H7 A3 3 0 0 1 4 41 Z"
        fill="url(#stSheen)"/>
  <path d="M4 7 A3 3 0 0 1 7 4 H37 L44 11 V41 A3 3 0 0 1 41 44 H7 A3 3 0 0 1 4 41 Z" fill="none" stroke="#CDC2A8"/>

  <!-- 竖：粗，起笔带顿、收笔悬针（宋体竖的字形特征） -->
  <path d="M21.7 13 L26.3 13 L26.3 30.4 L24 35.4 L21.7 30.4 Z" fill="#2A2722"/>
  <path d="M26.3 13 L28.5 14.6 L26.3 16.2 Z" fill="#2A2722"/>

  <!-- 横：细，两头三角顿角（宋体横的起收笔） -->
  <rect x="12.4" y="21" width="20.2" height="2.3" fill="#2A2722"/>
  <path d="M10.5 20.6 L12.4 21 L12.4 23.3 Z" fill="#2A2722"/>
  <path d="M32.6 21 L34.9 23.3 L32.6 23.3 Z" fill="#2A2722"/>

  <!-- 印刷套准角标（灰绿，印刷物的小暗号；32px 下隐去，128px 下可见） -->
  <g stroke="#6B7255" stroke-opacity="0.55" stroke-width="0.9">
    <circle cx="10.6" cy="37.4" r="2.3" fill="none"/>
    <path d="M10.6 33.8 V41 M7 37.4 H14.2"/>
  </g>
</svg>
